<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>วงล้อสุ่มอาหาร & หารค่าอาหาร</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #4285F4;
      --red: #EA4335;
      --yellow: #FBBC05;
      --green: #34A853;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 14px;
      max-width: 680px;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--blue), var(--red), var(--yellow), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* Main App Navigation */
    .main-nav {
      display: flex;
      background: #E2E8F0;
      padding: 5px;
      border-radius: 16px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 460px;
      gap: 6px;
    }

    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background: #FFFFFF;
      color: var(--text);
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .view-section {
      display: none;
      width: 100%;
      max-width: 1100px;
    }

    .view-section.active {
      display: block;
    }

    .app-container {
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .app-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
      border: 1px solid var(--border);
    }

    /* Mode Switcher */
    .mode-switch {
      display: flex;
      background: #F1F5F9;
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 14px;
      gap: 6px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #FFFFFF;
      color: var(--blue);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .filter-bar {
      display: none;
      margin-bottom: 14px;
      align-items: center;
      gap: 8px;
    }

    .filter-bar.show {
      display: flex;
    }

    .filter-bar label {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      color: var(--muted);
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.92rem;
      color: var(--text);
      background: #FFFFFF;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--blue);
    }

    /* Wheel Wrapper */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wheel-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      margin: 8px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
      border: 6px solid #FFFFFF;
      touch-action: manipulation;
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 30px solid #1E293B;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25));
      z-index: 10;
      transition: transform 0.08s ease;
    }

    .pointer.tick {
      transform: translateX(-50%) rotate(-12deg);
    }

    .center-hub {
      position: absolute;
      width: 54px;
      height: 54px;
      background: #FFFFFF;
      border: 4px solid #1E293B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.78rem;
      color: #1E293B;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 5;
    }

    .spin-btn {
      width: 100%;
      max-width: 320px;
      padding: 14px 24px;
      border: none;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #FFFFFF;
      background: linear-gradient(135deg, var(--blue), #2563EB);
      box-shadow: 0 8px 20px rgba(66, 133, 244, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(66, 133, 244, 0.45);
    }

    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Management Panel */
    .panel-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn-add {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .btn-add:hover {
      opacity: 0.9;
    }

    .item-list {
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.92rem;
      gap: 10px;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .item-name {
      font-weight: 500;
      word-break: break-word;
    }

    .badge {
      font-size: 0.75rem;
      background: #E2E8F0;
      color: #475569;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .btn-del {
      border: none;
      background: #FEE2E2;
      color: var(--red);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .btn-reset {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Bill Splitter Styles */
    .bill-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .bill-grid {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .people-counter {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .counter-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #FFFFFF;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--blue);
    }

    .counter-val {
      font-size: 1.2rem;
      font-weight: 700;
      min-width: 40px;
      text-align: center;
    }

    .tax-toggles {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toggle-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      background: #F8FAFC;
    }

    .toggle-pill input {
      accent-color: var(--blue);
      width: 16px;
      height: 16px;
    }

    .people-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .person-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #EFF6FF;
      color: var(--blue);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .person-pill button {
      border: none;
      background: none;
      color: var(--red);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .dish-card {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .dish-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .dish-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .dish-price {
      font-weight: 700;
      color: var(--green);
      font-size: 0.95rem;
    }

    .sharer-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sharer-chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .sharer-chip.selected {
      background: var(--blue);
      color: #FFFFFF;
      border-color: var(--blue);
    }

    /* Summary Box */
    .summary-highlight {
      background: linear-gradient(135deg, #1E293B, #0F172A);
      color: #FFFFFF;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      text-align: center;
    }

    .summary-highlight .label {
      font-size: 0.85rem;
      color: #94A3B8;
    }

    .summary-highlight .amount {
      font-size: 2rem;
      font-weight: 700;
      color: var(--yellow);
      margin: 4px 0;
    }

    .summary-highlight .sub {
      font-size: 0.85rem;
      color: #CBD5E1;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.92rem;
    }

    .breakdown-row:last-child {
      border-bottom: none;
    }

    .copy-btn {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Result Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-tag {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #EFF6FF;
      color: var(--blue);
      margin-bottom: 10px;
    }

    .modal-result {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .saved-restaurants-box {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 18px;
      text-align: left;
    }

    .saved-restaurants-box h4 {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .restaurant-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: #FFFFFF;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary-modal {
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.98rem;
      cursor: pointer;
    }

    .btn-secondary-modal {
      padding: 11px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #FFFFFF;
      color: var(--text);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>มื้อนี้กินอะไรดี & หารบิล</h1>
    <p>สุ่มเมนูและร้านโปรด พร้อมคำนวณค่าใช้จ่ายตามจำนวนคน</p>
  </header>

  <!-- Top Navigation -->
  <nav class="main-nav">
    <button class="nav-btn active" id="navWheelBtn" onclick="switchMainView('wheel')">วงล้อสุ่มอาหาร</button>
    <button class="nav-btn" id="navBillBtn" onclick="switchMainView('bill')">คำนวณบิล / หารเงิน</button>
  </nav>

  <!-- VIEW 1: SPINNER WHEEL -->
  <main class="view-section active" id="wheelView">
    <div class="app-container">
      <!-- Left: Wheel Card -->
      <section class="card wheel-section">
        <div class="mode-switch">
          <button class="mode-btn active" id="modeCatBtn" onclick="setSpinMode('category')">สุ่มหมวดอาหาร</button>
          <button class="mode-btn" id="modeRestBtn" onclick="setSpinMode('restaurant')">สุ่มร้านอาหาร</button>
        </div>

        <div class="filter-bar" id="restFilterBar">
          <label for="wheelCatFilter">เลือกหมวด:</label>
          <select id="wheelCatFilter" onchange="onFilterChange()"></select>
        </div>

        <div class="wheel-wrapper">
          <div class="pointer" id="pointer"></div>
          <canvas id="wheelCanvas" width="700" height="700" onclick="spinWheel()"></canvas>
          <div class="center-hub">สุ่มเลย</div>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">หมุนวงล้อ!</button>
      </section>

      <!-- Right: Manager Card -->
      <section class="card">
        <div class="panel-tabs">
          <button class="tab-btn active" id="tabRestBtn" onclick="setManagerTab('restaurant')">จัดการร้านอาหาร</button>
          <button class="tab-btn" id="tabCatBtn" onclick="setManagerTab('category')">จัดการหมวดอาหาร</button>
        </div>

        <!-- Tab: Manage Restaurants -->
        <div id="manageRestSection">
          <div style="margin-bottom: 10px;">
            <select id="managerCatSelect" onchange="renderManagerList()"></select>
          </div>
          <form class="add-form" onsubmit="addRestaurant(event)">
            <input type="text" id="newRestInput" placeholder="พิมพ์ชื่อร้าน
